# Contract for the accounts gold layer (stage pipeline/4_score.py), 17 columns (docs/ARCHITECTURE.md D9.6 item 9, rules D9.9, amended by D10 and D11).
# Ranges come from MEANING, not from observed values (a score is 0 to 100, a band has its fixed set).
# Run from the repo root (the cross-file checks use relative paths):
#   python .claude/skills/data-quality-check/scripts/check_contract.py context/contracts/accounts.yml --report
# Checks the generic runner cannot express (independent recompute of fit, urgency, contact, bands, caps and top_signals from signals;
# why phrase and truth checks; sort order; the observed numbers table):
#   python .claude/skills/data-quality-check/scripts/check_accounts_extra.py
#
# PROVISIONAL CONSTANTS (D9.7, D10, D11): FLOOR (0.5), X (40, contact threshold), Y (20, the FLOOR of the review band, D11.7) and REVIEW_N (200,
# D11.2) are hard-coded in the checks marked "PROVISIONAL" below and in the constants block of check_accounts_extra.py. They are NOT calibrated
# and NOT owner-approved: N = ceil(C / r) with placeholder C = 50 (rep capacity per week) and r = 0.25 (clearance rate); X and Y are the D9.7
# starting point; territory points are 0 (D11.5) until the owner supplies the list. When scoring-calibration or the owner changes FLOOR, X, Y or N,
# change them in this file (the checks marked "PROVISIONAL", including the `200 AS n` CTE of the three top-N checks) and in the constants
# block of check_accounts_extra.py in the same PR as section 3.4 of ARCHITECTURE.md; a contract changes only with a reason. On the FULL run N is
# derived from the prod ceiling and is not scaled from the sample (D9.8, D11.2). The checks that never change with calibration: 0 <= contact_score
# <= urgency_score, the score ranges, the band set, the cap logic, the exclude rule (D9.3, decided), the why rules.
# D12 (2026-10-11): the rank order, the skip clause and the exposure phrase changed; the scores did not (bands 0 / 200 / 5,589 / 1 on the sample).
# D11 BAND MODEL: band_uncapped is threshold-based (contact from X, review from Y, else skip). band is the stored band after the caps and the
# D11.2 top-N rule: every would-be contact is held in review (cap), plus the best remaining non-excluded accounts by the total order
# (D12.1 order: contact_score desc, urgency_score desc, operator_name_shape asc with false first, coalesce(kev_host_count, 0) desc, host_count desc, account_id asc) until the band holds REVIEW_N rows, with the floor contact_score >= Y;
# everything else non-excluded is skip. So band_uncapped = review with band = skip is legitimate (beyond the cut), cap_reasons exist only for
# would-be contacts, and a skip why with urgency above 0 ends "Below the review cut-off." (D11.3) or, when the kept top_signals name kev_exposed or
# max_cvss_band, "Ranked below this run's review list; a rank, not a judgement of risk." (D12.2). The exposure phrase is the D12.3 string (docs/ISSUES.md DQ-017 to DQ-019).
# STAGE-4 RULE, relaxed at M3: decision and prompt_version are all null and final_band = band, and no account is in `contact` while
# decision is null (D10). llm/adjudicate.py may set decision, prompt_version and final_band = decision for band = review rows only; the
# M3 PR must replace the checks marked "M2 only" by D9.9 rule 6 (decision null unless band = review; prompt_version null exactly when
# decision is null; final_band = decision for decisions contact or skip).
# CONVENTION (stage 4, not spelled out in D9.6): an excluded account has band_uncapped = 'exclude' and band = 'exclude' and no cap_reasons.
# CAP REASONS ORDER (stage 4 and this contract): alphabetical (low_confidence, operator_name_shape, operator_unverified, singleton),
# comma separated, no spaces, no duplicates, null when none. D9.6 item 5 listed the order operator_name_shape, operator_unverified,
# low_confidence, singleton; the stage sorts alphabetically; the contract follows the stage (docs/ISSUES.md DQ-012).
layer: accounts
path: data/gold/accounts.parquet
key: account_id          # one row per account (D9.6 item 1); account_id = company_id

# row_rule: accounts rows == signals rows (the join fan-out guard, CLAUDE.md). A second guard against companies.parquet follows in `checks`.
# On the FULL run the stage reads signals_full.parquet and writes accounts_full.parquet: change `path`, `other` and the cross-file paths in
# the PR that promotes to prod; a contract changes only with a reason.
row_rule:
  other: data/gold/signals.parquet
  op: "=="

columns:
  account_id: {type: VARCHAR, nullable: false}
  company_name: {type: VARCHAR, nullable: false}
  country_code: {type: VARCHAR}                          # carried from signals; null only when every host of the company has a null country
  host_count: {type: INTEGER, nullable: false, min: 1}
  identity_source: {type: VARCHAR, nullable: false}
  identity_confidence: {type: VARCHAR, nullable: false}
  fit_score: {type: INTEGER, nullable: false, min: 0, max: 100}
  urgency_score: {type: INTEGER, nullable: false, min: 0, max: 100}
  contact_score: {type: INTEGER, nullable: false, min: 0, max: 100}
  top_signals: {type: VARCHAR}                           # null for urgency 0 and for excluded accounts (check below)
  band_uncapped: {type: VARCHAR, nullable: false}
  cap_reasons: {type: VARCHAR}                           # null exactly when band_uncapped is not contact (D11: only would-be contacts are capped)
  band: {type: VARCHAR, nullable: false}
  why: {type: VARCHAR, nullable: false}
  decision: {type: VARCHAR}                              # null until M3
  prompt_version: {type: VARCHAR}                        # null until M3
  final_band: {type: VARCHAR, nullable: false}

# Shared denylist leakage check on the carried name column (hyperscaler, CDN, ISP and hosting names must not be accounts).
denylist:
  column: company_name
  rules: shared

checks:
  # ---- structure -------------------------------------------------------------------------------------------------------------
  - name: exactly 17 columns (D9.6 item 9)
    sql: "SELECT count(*) FROM (DESCRIBE t)"
    expect: 17
  - name: every column has exactly the contracted name and type, in the contracted order (the runner matches types by prefix, DQ-010)
    sql: >-
      SELECT count(*) FROM (SELECT column_name, column_type, row_number() OVER () AS pos FROM (DESCRIBE t))
      WHERE (column_name, column_type, pos) NOT IN (('account_id', 'VARCHAR', 1), ('company_name', 'VARCHAR', 2), ('country_code', 'VARCHAR', 3),
      ('host_count', 'INTEGER', 4), ('identity_source', 'VARCHAR', 5), ('identity_confidence', 'VARCHAR', 6), ('fit_score', 'INTEGER', 7),
      ('urgency_score', 'INTEGER', 8), ('contact_score', 'INTEGER', 9), ('top_signals', 'VARCHAR', 10), ('band_uncapped', 'VARCHAR', 11),
      ('cap_reasons', 'VARCHAR', 12), ('band', 'VARCHAR', 13), ('why', 'VARCHAR', 14), ('decision', 'VARCHAR', 15),
      ('prompt_version', 'VARCHAR', 16), ('final_band', 'VARCHAR', 17))
  - name: account_id is 16 lowercase hex characters
    sql: "SELECT count(*) FROM t WHERE NOT regexp_matches(account_id, '^[0-9a-f]{16}$')"
  # ---- fan-out and id sets: accounts == signals == companies (D9.9 rule 1) -------------------------------------------------------
  - name: row count equals companies.parquet (second row guard; the first is row_rule against signals.parquet)
    sql: "SELECT (SELECT count(*) FROM t) - (SELECT count(*) FROM read_parquet('data/silver/companies.parquet'))"
  - name: cross-file, account_id sets equal the signals company_id set in both directions (no fan-out, no drop, account_id = company_id)
    sql: >-
      SELECT (SELECT count(*) FROM t WHERE account_id NOT IN (SELECT company_id FROM read_parquet('data/gold/signals.parquet')))
      + (SELECT count(*) FROM read_parquet('data/gold/signals.parquet') WHERE company_id NOT IN (SELECT account_id FROM t))
  - name: cross-file, account_id sets equal the companies company_id set in both directions
    sql: >-
      SELECT (SELECT count(*) FROM t WHERE account_id NOT IN (SELECT company_id FROM read_parquet('data/silver/companies.parquet')))
      + (SELECT count(*) FROM read_parquet('data/silver/companies.parquet') WHERE company_id NOT IN (SELECT account_id FROM t))
  - name: cross-file, the carried columns (company_name, country_code, host_count, identity_source, identity_confidence) equal signals on every row
    sql: >-
      SELECT count(*) FROM t JOIN read_parquet('data/gold/signals.parquet') s ON s.company_id = t.account_id
      WHERE t.company_name IS DISTINCT FROM s.company_name OR t.country_code IS DISTINCT FROM s.country_code
      OR t.host_count IS DISTINCT FROM s.host_count OR t.identity_source IS DISTINCT FROM s.identity_source
      OR t.identity_confidence IS DISTINCT FROM s.identity_confidence
  - name: company_name is non-empty and trimmed
    sql: "SELECT count(*) FROM t WHERE trim(company_name) = '' OR company_name <> trim(company_name)"
  # ---- scores (D9.6 items 2 to 4; the ranges come from the column rules above) ----------------------------------------------------
  - name: contact_score is between 0 and urgency_score (never changes with calibration; no fit can raise contact above urgency)
    sql: "SELECT count(*) FROM t WHERE contact_score < 0 OR contact_score > urgency_score"
  - name: PROVISIONAL FLOOR 0.5, contact_score >= FLOOR * urgency_score exactly (integer round half up never falls below FLOOR * urgency)
    sql: "SELECT count(*) FROM t WHERE contact_score * 100 < 50 * urgency_score"
  - name: contact_score is 0 when urgency_score is 0 (a company with no urgency scores 0 under form (b))
    sql: "SELECT count(*) FROM t WHERE urgency_score = 0 AND contact_score <> 0"
  - name: fit_score 0 gives contact_score exactly round half up of FLOOR * urgency (PROVISIONAL FLOOR 0.5)
    sql: "SELECT count(*) FROM t WHERE fit_score = 0 AND contact_score <> (urgency_score + 1) // 2"
  - name: fit_score 100 gives contact_score equal to urgency_score
    sql: "SELECT count(*) FROM t WHERE fit_score = 100 AND contact_score <> urgency_score"
  # ---- bands (D9.6 item 5, D9.9 rules 3 to 5, D10) -------------------------------------------------------------------------------
  - name: band, band_uncapped and final_band are all in (contact, review, skip, exclude)
    sql: >-
      SELECT count(*) FROM t WHERE band NOT IN ('contact', 'review', 'skip', 'exclude') OR band_uncapped NOT IN ('contact', 'review', 'skip', 'exclude')
      OR final_band NOT IN ('contact', 'review', 'skip', 'exclude')
  - name: PROVISIONAL X = 40, Y = 20, band_uncapped follows contact_score (contact from 40, review from 20, else skip) for every non-excluded account (threshold-based, before the top-N cut)
    sql: >-
      SELECT count(*) FROM t WHERE band_uncapped <> 'exclude' AND band_uncapped IS DISTINCT FROM
      (CASE WHEN contact_score >= 40 THEN 'contact' WHEN contact_score >= 20 THEN 'review' ELSE 'skip' END)
  - name: exclude exactly when noise_host_count >= 2 AND noise_host_share >= 0.5 (D9.3 and DQ-008; cross-file to signals); one honeypot row on a singleton is not exclude
    sql: >-
      SELECT count(*) FROM t JOIN read_parquet('data/gold/signals.parquet') s ON s.company_id = t.account_id
      WHERE (t.band = 'exclude') IS DISTINCT FROM (s.noise_host_count >= 2 AND s.noise_host_share >= 0.5)
  - name: band_uncapped is exclude exactly when band is exclude (stage convention), and an excluded account has no cap_reasons
    sql: >-
      SELECT count(*) FROM t WHERE (band_uncapped = 'exclude') IS DISTINCT FROM (band = 'exclude') OR (band = 'exclude' AND cap_reasons IS NOT NULL)
  - name: bands move only as a cap (band_uncapped contact to band review) or the top-N cut (band_uncapped review to band skip); never up, never contact to skip, never skip to review (D11.2)
    sql: >-
      SELECT count(*) FROM t WHERE band <> band_uncapped AND NOT ((band_uncapped = 'contact' AND band = 'review') OR (band_uncapped = 'review' AND band = 'skip'))
  - name: every would-be contact is in band review (caps never drop a would-be contact; D11.2)
    sql: "SELECT count(*) FROM t WHERE band_uncapped = 'contact' AND band <> 'review'"
  - name: cap_reasons is null exactly when band_uncapped is not contact (a skip account may have band_uncapped review; only would-be contacts are capped; D11)
    sql: "SELECT count(*) FROM t WHERE (cap_reasons IS NULL) IS DISTINCT FROM (band_uncapped <> 'contact')"
  - name: PROVISIONAL N = 200, Y = 20, review is every would-be contact plus the non-excluded accounts with contact_score >= Y ranked by the D12.1 order (contact_score desc, urgency_score desc, operator_name_shape asc, coalesce(kev_host_count, 0) desc, host_count desc, account_id asc) at rank N or better; excluded accounts take no slot (D11.2, recomputed in SQL)
    sql: >-
      WITH p AS (SELECT 200 AS n), r AS (SELECT t.band, t.band_uncapped, t.contact_score, row_number() OVER (ORDER BY t.contact_score DESC, t.urgency_score DESC,
      coalesce(s.operator_name_shape, false) ASC, coalesce(s.kev_host_count, 0) DESC, t.host_count DESC, t.account_id ASC) AS rn
      FROM t JOIN read_parquet('data/gold/signals.parquet') s ON s.company_id = t.account_id WHERE t.band_uncapped <> 'exclude')
      SELECT count(*) FROM r WHERE (band = 'review') IS DISTINCT FROM (band_uncapped = 'contact' OR (contact_score >= 20 AND rn <= (SELECT n FROM p)))
  - name: PROVISIONAL N = 200, Y = 20, the review band holds N rows (or every would-be contact when they exceed N, or every account with contact_score >= Y when fewer exist) (D11.2)
    sql: >-
      WITH p AS (SELECT 200 AS n), w AS (SELECT count(*) AS c FROM t WHERE band_uncapped = 'contact'), e AS (SELECT count(*) AS c FROM t WHERE band_uncapped = 'review')
      SELECT abs((SELECT count(*) FROM t WHERE band = 'review') - ((SELECT c FROM w) + least(greatest((SELECT n FROM p) - (SELECT c FROM w), 0), (SELECT c FROM e))))
  - name: PROVISIONAL Y = 20, N = 200, skip implies contact_score below Y or a rank beyond the cut (the weakest review account outranks every skip account with contact_score >= Y; D11.2)
    sql: >-
      WITH p AS (SELECT 200 AS n), r AS (SELECT t.band, t.band_uncapped, t.contact_score, row_number() OVER (ORDER BY t.contact_score DESC, t.urgency_score DESC,
      coalesce(s.operator_name_shape, false) ASC, coalesce(s.kev_host_count, 0) DESC, t.host_count DESC, t.account_id ASC) AS rn
      FROM t JOIN read_parquet('data/gold/signals.parquet') s ON s.company_id = t.account_id WHERE t.band_uncapped <> 'exclude')
      SELECT count(*) FROM r WHERE band = 'skip' AND contact_score >= 20 AND rn <= (SELECT n FROM p)
  - name: no account is in band contact while decision is null (D10; only adjudication may clear a would-be contact)
    sql: "SELECT count(*) FROM t WHERE band = 'contact' AND decision IS NULL"
  - name: M2 only, band = review with band_uncapped = contact exactly when cap_reasons contains operator_unverified (D10)
    sql: >-
      SELECT count(*) FROM t WHERE (band = 'review' AND band_uncapped = 'contact')
      IS DISTINCT FROM coalesce(list_contains(string_split(cap_reasons, ','), 'operator_unverified'), false)
  # ---- cap reasons (D9.6 item 5, D10) -------------------------------------------------------------------------------------------
  - name: cap_reasons holds only low_confidence, operator_name_shape, operator_unverified, singleton, comma separated, alphabetical, no duplicates, no spaces, never empty
    sql: >-
      SELECT count(*) FROM t WHERE cap_reasons IS NOT NULL AND (NOT list_has_all(['low_confidence', 'operator_name_shape', 'operator_unverified', 'singleton'],
      string_split(cap_reasons, ',')) OR string_split(cap_reasons, ',') <> list_sort(string_split(cap_reasons, ','))
      OR len(string_split(cap_reasons, ',')) <> len(list_distinct(string_split(cap_reasons, ','))))
  - name: operator_unverified is carried by every would-be contact (band_uncapped = contact) and by no other account
    sql: >-
      SELECT count(*) FROM t WHERE (band_uncapped = 'contact') IS DISTINCT FROM coalesce(list_contains(string_split(cap_reasons, ','), 'operator_unverified'), false)
  - name: singleton is listed exactly for would-be contacts with is_singleton in signals
    sql: >-
      SELECT count(*) FROM t JOIN read_parquet('data/gold/signals.parquet') s ON s.company_id = t.account_id
      WHERE coalesce(list_contains(string_split(t.cap_reasons, ','), 'singleton'), false) IS DISTINCT FROM (t.band_uncapped = 'contact' AND s.is_singleton)
  - name: low_confidence is listed exactly for would-be contacts with identity_confidence = low in signals
    sql: >-
      SELECT count(*) FROM t JOIN read_parquet('data/gold/signals.parquet') s ON s.company_id = t.account_id
      WHERE coalesce(list_contains(string_split(t.cap_reasons, ','), 'low_confidence'), false) IS DISTINCT FROM (t.band_uncapped = 'contact' AND s.identity_confidence = 'low')
  - name: operator_name_shape is listed exactly for would-be contacts whose signals row has operator_shape_t1 or operator_shape_t2 (the union, D10)
    sql: >-
      SELECT count(*) FROM t JOIN read_parquet('data/gold/signals.parquet') s ON s.company_id = t.account_id
      WHERE coalesce(list_contains(string_split(t.cap_reasons, ','), 'operator_name_shape'), false)
      IS DISTINCT FROM (t.band_uncapped = 'contact' AND (s.operator_shape_t1 OR s.operator_shape_t2))
  - name: a singleton, a low-confidence or an operator-named account is never in band contact (D8.2, D9.9 rule 4)
    sql: >-
      SELECT count(*) FROM t JOIN read_parquet('data/gold/signals.parquet') s ON s.company_id = t.account_id
      WHERE t.band = 'contact' AND (s.is_singleton OR s.identity_confidence = 'low' OR s.operator_shape_t1 OR s.operator_shape_t2)
  # ---- M2 only: adjudication columns (D9.6 item 6, D9.9 rule 6) ------------------------------------------------------------------
  - name: M2 only, final_band equals band on every row
    sql: "SELECT count(*) FROM t WHERE final_band IS DISTINCT FROM band"
  - name: M2 only, decision and prompt_version are null on every row
    sql: "SELECT count(*) FROM t WHERE decision IS NOT NULL OR prompt_version IS NOT NULL"
  # ---- why (D9.6 item 7, D10; safety wording) -----------------------------------------------------------------------------------
  - name: every account has a non-empty, trimmed why
    sql: "SELECT count(*) FROM t WHERE why IS NULL OR trim(why) = '' OR why <> trim(why)"
  - name: why has at most 40 words (D9.6 item 7, D9.8)
    sql: "SELECT count(*) FROM t WHERE len(string_split_regex(trim(why), '\\s+')) > 40"
  - name: why contains no '=' and no '_' (no column names or formulas shown to a salesperson)
    sql: "SELECT count(*) FROM t WHERE why LIKE '%=%' OR why LIKE '%\\_%' ESCAPE '\\'"
  - name: why never claims a breach (breach, compromised, hacked; case-insensitive)
    sql: "SELECT count(*) FROM t WHERE regexp_matches(lower(why), 'breach|compromised|hacked')"
  - name: why of every would-be contact (band_uncapped = contact, not excluded) ends with the D10 clause, and no other account carries it
    sql: >-
      SELECT count(*) FROM t WHERE (band_uncapped = 'contact') IS DISTINCT FROM
      ends_with(why, 'Not yet checked that this is an end-user organisation, not a network operator.')
  - name: why of every skip account whose top_signals name kev_exposed or max_cvss_band ends with the D12.2 clause "Ranked below this run's review list; a rank, not a judgement of risk.", and no other account carries it
    sql: >-
      SELECT count(*) FROM t WHERE (band = 'skip' AND (coalesce(list_contains(string_split(top_signals, ','), 'kev_exposed'), false)
      OR coalesce(list_contains(string_split(top_signals, ','), 'max_cvss_band'), false))) IS DISTINCT FROM ends_with(why, 'Ranked below this run''s review list; a rank, not a judgement of risk.')
  - name: why of every other skip account with urgency above 0 ends with the D11.3 clause "Below the review cut-off.", and no other account carries it (D12.2)
    sql: >-
      SELECT count(*) FROM t WHERE (band = 'skip' AND urgency_score > 0 AND NOT coalesce(list_contains(string_split(top_signals, ','), 'kev_exposed'), false)
      AND NOT coalesce(list_contains(string_split(top_signals, ','), 'max_cvss_band'), false)) IS DISTINCT FROM ends_with(why, 'Below the review cut-off.')
  - name: the two skip clauses never appear together and never inside a non-skip why (a skip why carries at most one of them)
    sql: >-
      SELECT count(*) FROM t WHERE (contains(why, 'Below the review cut-off.') AND contains(why, 'Ranked below this run''s review list'))
      OR (band <> 'skip' AND (contains(why, 'Below the review cut-off.') OR contains(why, 'Ranked below this run''s review list')))
  - name: why of every review row whose name has the operator shape (signals operator_shape_t1 or operator_shape_t2) contains "Name looks like a network operator.", and no other row does (D9.6 item 7, D11.3)
    sql: >-
      SELECT count(*) FROM t JOIN read_parquet('data/gold/signals.parquet') s ON s.company_id = t.account_id
      WHERE (t.band = 'review' AND (s.operator_shape_t1 OR s.operator_shape_t2)) IS DISTINCT FROM contains(t.why, 'Name looks like a network operator.')
  - name: why never uses the pre-D11 wording or a forbidden phrase (Exposure is limited, with a vulnerability on the CISA, worst vulnerability scores, located in, based in, is vulnerable, known-exploited host, has been exploited, on outdated software)
    sql: >-
      SELECT count(*) FROM t WHERE regexp_matches(lower(why), 'exposure is limited|with a vulnerability on the cisa|worst vulnerability scores|located in|based in|is vulnerable|known-exploited host|has been exploited|on outdated software')
  - name: the KEV phrase "N host(s) running software whose version matches the CISA known-exploited list" is in why exactly when top_signals names kev_exposed (D11.3, RAW-006)
    sql: >-
      SELECT count(*) FROM t WHERE coalesce(list_contains(string_split(top_signals, ','), 'kev_exposed'), false)
      IS DISTINCT FROM regexp_matches(why, '[0-9]+ hosts? running software whose version matches the CISA known-exploited list')
  - name: the CVSS phrase "worst version-matched vulnerability scores CVSS X" is in why exactly when top_signals names max_cvss_band (D11.3, RAW-006)
    sql: >-
      SELECT count(*) FROM t WHERE coalesce(list_contains(string_split(top_signals, ','), 'max_cvss_band'), false)
      IS DISTINCT FROM regexp_matches(why, '[Ww]orst version-matched vulnerability scores CVSS [0-9]+(\.[0-9]+)?')
  - name: the exposure phrase "an exposed admin or database service (<ports>) on software that is end-of-life or whose version matches a CVSS 7+ vulnerability" is in why exactly when top_signals names exposed_and_outdated (D12.3)
    sql: >-
      SELECT count(*) FROM t WHERE coalesce(list_contains(string_split(top_signals, ','), 'exposed_and_outdated'), false)
      IS DISTINCT FROM regexp_matches(why, '[Aa]n exposed admin or database service \([^)]*\) on software that is end-of-life or whose version matches a CVSS 7\+ vulnerability')
  - name: why of an excluded account is the honeypot text, and no other account carries it
    sql: "SELECT count(*) FROM t WHERE (band = 'exclude') IS DISTINCT FROM starts_with(why, 'Mostly honeypot or attacker-infrastructure hosts (')"
  # ---- top_signals (D9.6 item 7: names exist and are true in signals) -------------------------------------------------------------
  - name: top_signals is null exactly when urgency_score is 0 or the account is excluded (no exposure signal, or excluded)
    sql: "SELECT count(*) FROM t WHERE (top_signals IS NULL) IS DISTINCT FROM (urgency_score = 0 OR band = 'exclude')"
  - name: top_signals never names in_territory while territory carries 0 points (D11.5, PROVISIONAL until the owner supplies the list)
    sql: "SELECT count(*) FROM t WHERE coalesce(list_contains(string_split(top_signals, ','), 'in_territory'), false)"
  - name: top_signals holds one or two names from the nine scored signals, distinct
    sql: >-
      SELECT count(*) FROM t WHERE top_signals IS NOT NULL AND (NOT list_has_all(['kev_exposed', 'max_cvss_band', 'exposed_and_outdated',
      'risky_non_ssh_exposed', 'risky_service_exposed', 'eol_stack', 'cert_expired_or_soon', 'legacy_tls', 'in_territory', 'footprint_band',
      'sensitive_stack'], string_split(top_signals, ',')) OR len(string_split(top_signals, ',')) > 2
      OR len(string_split(top_signals, ',')) <> len(list_distinct(string_split(top_signals, ','))))
  - name: every name in top_signals is true in signals for that account
    sql: >-
      SELECT count(*) FROM (SELECT account_id, unnest(string_split(top_signals, ',')) AS tok FROM t WHERE top_signals IS NOT NULL) x
      JOIN read_parquet('data/gold/signals.parquet') s ON s.company_id = x.account_id
      WHERE NOT coalesce(CASE x.tok WHEN 'kev_exposed' THEN s.kev_exposed WHEN 'max_cvss_band' THEN s.max_cvss_band >= 1
      WHEN 'exposed_and_outdated' THEN s.exposed_and_outdated WHEN 'risky_non_ssh_exposed' THEN s.risky_non_ssh_exposed
      WHEN 'risky_service_exposed' THEN s.risky_service_exposed WHEN 'eol_stack' THEN s.eol_stack WHEN 'cert_expired_or_soon' THEN s.cert_expired_or_soon
      WHEN 'legacy_tls' THEN s.legacy_tls WHEN 'in_territory' THEN s.in_territory WHEN 'footprint_band' THEN s.footprint_band >= 1
      WHEN 'sensitive_stack' THEN s.sensitive_stack END, false)
