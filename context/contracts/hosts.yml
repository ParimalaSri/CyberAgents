# Contract for the hosts silver layer (stage pipeline/1_clean.py), 36 columns after D6/D7. Ranges come from MEANING, not from observed values.
# Run: python .claude/skills/data-quality-check/scripts/check_contract.py context/contracts/hosts.yml --report
# Extra checks that the generic runner cannot express (denylist on a row subset, recomputation from raw):
#   python .claude/skills/data-quality-check/scripts/check_hosts_extra.py
layer: hosts
path: data/silver/hosts.parquet
key: [host_ip, port, transport]      # one row per service endpoint, unique and non-null (RAW-004, PIPE-002)

# row_rule: hosts <= raw input rows. The raw input is JSON lines, which the runner's row_rule cannot read, so it is the
# custom check "row count <= raw input rows" below. SOURCE of the constant: data/sample/spread_100k.jsonl (D3 seek-spread
# sample), 100,000 lines, counted by check_hosts_extra.py. On the FULL run replace the constant with the full-file row count
# (and the path) in the PR that promotes to prod; the contract changes only with a reason.

columns:
  host_ip: {type: VARCHAR, nullable: false}                 # RAW-003: coalesce(ip_str, ipv6)
  port: {type: BIGINT, nullable: false, min: 0, max: 65535}
  transport: {type: VARCHAR, nullable: false}
  timestamp: {type: TIMESTAMP}
  org: {type: VARCHAR}
  org_norm: {type: VARCHAR}
  isp: {type: VARCHAR}
  asn: {type: VARCHAR}
  country_code: {type: VARCHAR}
  product: {type: VARCHAR}
  version: {type: VARCHAR}
  os: {type: VARCHAR}
  cpe: {type: "VARCHAR[]"}
  tags: {type: "VARCHAR[]"}
  cloud_provider: {type: VARCHAR}
  shodan_module: {type: VARCHAR}
  cert_expires: {type: TIMESTAMP, min: "TIMESTAMP '1990-01-01'", max: "TIMESTAMP '2100-12-31 23:59:59'"}   # RAW-007, PIPE-001
  cert_issued: {type: TIMESTAMP, min: "TIMESTAMP '1990-01-01'", max: "TIMESTAMP '2100-12-31 23:59:59'"}    # PIPE-001
  cert_expired: {type: BOOLEAN}
  cert_date_invalid: {type: BOOLEAN, nullable: false}      # D6.3: a cert date was present but nulled (outside 1990..2100 or unparseable)
  cert_subject_o: {type: VARCHAR}
  cert_subject_cn: {type: VARCHAR}
  ssl_versions: {type: "VARCHAR[]"}
  max_cvss: {type: DOUBLE, min: 0, max: 10}                 # CVSS is 0 to 10 by definition; null when no vulns
  has_kev: {type: BOOLEAN, nullable: false}
  vuln_count: {type: INTEGER, nullable: false, min: 0}      # cap 50 is a stage choice (RAW-006), checked separately
  hostnames: {type: "VARCHAR[]"}
  domains: {type: "VARCHAR[]"}
  hostnames_count: {type: INTEGER, nullable: false, min: 0}
  domains_count: {type: INTEGER, nullable: false, min: 0}
  dup_count: {type: INTEGER, nullable: false, min: 1}       # D6.5: raw rows that shared this key before dedupe (>= 1 by construction)
  is_noise: {type: BOOLEAN, nullable: false}
  is_infrastructure: {type: BOOLEAN, nullable: false}
  infra_reason: {type: VARCHAR}
  identity_source: {type: VARCHAR, nullable: false}
  name_norm: {type: VARCHAR}

# infra_reason values only from the shared matcher's INFRA_REASONS (isp_* fails, D5). Null is allowed here; "null exactly
# when not infrastructure" is the custom check below.
infra_reason:
  column: infra_reason
  nullable: true

# D4 identity_source: allowed values only, shares sum to 100%, resolved (org + cert_o) share inside 5..20% (D4 range).
shares:
  column: identity_source
  allowed: [infrastructure_unresolved, org, noise, cert_o, null_org]
  resolved_values: [org, cert_o]
  resolved_min: 5
  resolved_max: 20

# Denylist leakage on the name column that stage 2 will turn into company names. name_norm is set only for identity_source
# org and cert_o (custom check below), so every non-null name_norm must pass the shared rules. The generic runner cannot
# restrict a denylist check to identity_source='org' rows on the org column; that is done by check_hosts_extra.py.
denylist:
  column: name_norm
  rules: shared

checks:
  - name: exactly 36 columns (D6/D7 stage output)
    sql: "SELECT count(*) FROM (DESCRIBE t)"
    expect: 36
  - name: row count <= raw input rows (100000, data/sample/spread_100k.jsonl)
    sql: "SELECT CASE WHEN count(*) <= 100000 THEN 0 ELSE 1 END FROM t"
    expect: 0
  - name: host_ip not empty
    sql: "SELECT count(*) FROM t WHERE trim(host_ip) = ''"
  - name: transport in tcp, udp
    sql: "SELECT count(*) FROM t WHERE transport NOT IN ('tcp', 'udp')"
  - name: timestamp not in the future
    sql: "SELECT count(*) FROM t WHERE timestamp > now()::TIMESTAMP"
  - name: vuln_count cap 50 (stage choice RAW-006)
    sql: "SELECT count(*) FROM t WHERE vuln_count > 50"
  - name: max_cvss null exactly when no vulns counted
    sql: "SELECT count(*) FROM t WHERE (max_cvss IS NULL) <> (vuln_count = 0)"
  - name: has_kev implies vuln_count > 0
    sql: "SELECT count(*) FROM t WHERE has_kev AND vuln_count = 0"
  - name: hostnames_count equals length of hostnames
    sql: "SELECT count(*) FROM t WHERE hostnames_count <> coalesce(len(hostnames), 0)"
  - name: domains_count equals length of domains
    sql: "SELECT count(*) FROM t WHERE domains_count <> coalesce(len(domains), 0)"
  - name: cert_expires not before cert_issued
    sql: "SELECT count(*) FROM t WHERE cert_expires < cert_issued"
  - name: no raw payload columns (html, screenshot, data, http)
    sql: "SELECT count(*) FROM (DESCRIBE t) WHERE column_name IN ('html', 'screenshot', 'data', 'http')"
  - name: infra_reason non-null exactly when is_infrastructure
    sql: "SELECT count(*) FROM t WHERE (infra_reason IS NOT NULL) <> is_infrastructure"
  - name: noise tags imply is_noise
    sql: "SELECT count(*) FROM t WHERE coalesce(list_has_any(tags, ['honeypot','c2','tor','compromised']), false) AND NOT is_noise"
  - name: D6.1 RAT module pattern implies is_noise ((^|-)rat$ or njrat or blackshades)
    sql: "SELECT count(*) FROM t WHERE coalesce(regexp_matches(lower(shodan_module), '(^|-)rat$|^njrat$|^blackshades$'), false) AND NOT is_noise"
  - name: is_noise rows have a noise tag or a module matching the D6.1 pattern
    sql: "SELECT count(*) FROM t WHERE is_noise AND NOT coalesce(list_has_any(tags, ['honeypot','c2','tor','compromised']), false) AND NOT coalesce(regexp_matches(lower(shodan_module), '(^|-)rat$|^njrat$|^blackshades$'), false)"
  - name: njrat78 and xiaongmai-backdoor are not noise by module alone (D6.1, DQ-004 closed by design)
    sql: "SELECT count(*) FROM t WHERE lower(shodan_module) IN ('njrat78', 'xiaongmai-backdoor') AND is_noise AND NOT coalesce(list_has_any(tags, ['honeypot','c2','tor','compromised']), false)"
  - name: dup_count sum(dup_count - 1) + kept rows = raw rows with a host_ip (100000 on data/sample/spread_100k.jsonl; replace on the full run)
    sql: "SELECT sum(dup_count - 1) + count(*) FROM t"
    expect: 100000
  - name: cert_date_invalid true implies a cert date was nulled
    sql: "SELECT count(*) FROM t WHERE cert_date_invalid AND cert_expires IS NOT NULL AND cert_issued IS NOT NULL"
  - name: cloud or cdn tag, or non-empty cloud_provider, implies is_infrastructure
    sql: "SELECT count(*) FROM t WHERE (coalesce(list_has_any(tags, ['cloud','cdn']), false) OR coalesce(cloud_provider, '') <> '') AND NOT is_infrastructure"
  - name: identity_source noise exactly when is_noise
    sql: "SELECT count(*) FROM t WHERE (identity_source = 'noise') <> is_noise"
  - name: identity_source org rows are not infrastructure, not noise, with a non-empty org_norm
    sql: "SELECT count(*) FROM t WHERE identity_source = 'org' AND (is_infrastructure OR is_noise OR coalesce(org_norm, '') = '' OR org IS NULL)"
  - name: identity_source infrastructure_unresolved rows are infrastructure
    sql: "SELECT count(*) FROM t WHERE identity_source = 'infrastructure_unresolved' AND NOT is_infrastructure"
  - name: identity_source cert_o rows are infrastructure or have a null org, and have a cert O
    sql: "SELECT count(*) FROM t WHERE identity_source = 'cert_o' AND NOT (is_infrastructure OR org IS NULL) OR identity_source = 'cert_o' AND cert_subject_o IS NULL"
  - name: identity_source null_org rows have no org and are not infrastructure
    sql: "SELECT count(*) FROM t WHERE identity_source = 'null_org' AND (org IS NOT NULL OR is_infrastructure)"
  - name: name_norm null exactly when identity_source is not org or cert_o
    sql: "SELECT count(*) FROM t WHERE (name_norm IS NULL) <> (identity_source NOT IN ('org', 'cert_o'))"
  - name: name_norm not empty
    sql: "SELECT count(*) FROM t WHERE trim(name_norm) = ''"
  - name: org and cert_subject_o have no empty strings
    sql: "SELECT count(*) FROM t WHERE trim(org) = '' OR trim(cert_subject_o) = ''"
  - name: country_code is two letters when present
    sql: "SELECT count(*) FROM t WHERE country_code IS NOT NULL AND length(country_code) <> 2"
